{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card-wrap"><form method="post" class="card">{% csrf_token %}
  <h2>Log in to Celo</h2>
  {% if form.non_field_errors %}<ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
  <div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
  <div class="actions"><button class="btn" type="submit">Log in</button></div>
</form></div>
{% endblock %}
