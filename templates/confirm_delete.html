{% extends "base.html" %}
{% block title %}Delete{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-md">
  <form method="post" class="card">{% csrf_token %}
    <div class="card-header"><h1 class="card-title text-xl">Delete "{{ object }}"?</h1><p class="card-description">This can't be undone.</p></div>
    <div class="card-footer pt-4">
      <a class="btn btn-outline" href="{% url cancel_url %}">Cancel</a>
      <button class="btn btn-destructive" type="submit">Delete</button>
    </div>
  </form>
</div>
{% endblock %}
